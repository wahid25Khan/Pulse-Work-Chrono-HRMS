<template>
  <div class="page-wrapper">
    <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
      <div
        class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3"
      >
        <div class="my-auto mb-2">
          <h2 class="mb-1">{pageTitle}</h2>
          <nav>
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="javascript:void(0);"
                  ><i class="ti ti-smart-home"></i
                ></a>
              </li>
              <li class="breadcrumb-item">{breadcrumbParent}</li>
              <li class="breadcrumb-item active">{breadcrumbActive}</li>
            </ol>
          </nav>
        </div>
        <div
          class="d-flex my-xl-auto right-content align-items-center flex-wrap"
        >
          <div class="mb-2">
            <button
              class="btn btn-primary d-flex align-items-center"
              data-action="openAdd"
              onclick={handleActionClick}
            >
              <i class="ti ti-circle-plus me-2"></i>{addBtnLabel}
            </button>
          </div>
        </div>
      </div>

      <div class="card">
        <div
          class="card-header d-flex align-items-center justify-content-between flex-wrap row-gap-3"
        >
          <h5 class="mb-0">{listTitle}</h5>
          <div class="d-flex align-items-center">
            <div class="dropdown">
              <button class="btn btn-white dropdown-toggle">
                {sortByLabel}
              </button>
            </div>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-striped custom-table mb-0 datatable">
              <thead class="thead-light">
                <tr>
                  <th style="width: 30px">
                    <input type="checkbox" class="form-check-input" />
                  </th>
                  <th>{colName}</th>
                  <th>{colDesignation}</th>
                  <th>{colDepartment}</th>
                  <th>{colAppraisalDate}</th>
                  <th>{colStatus}</th>
                  <th class="text-end">Action</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={appraisalData} for:item="row">
                  <tr key={row.id}>
                    <td><input type="checkbox" class="form-check-input" /></td>
                    <td>
                      <div class="d-flex align-items-center">
                        <span class="avatar avatar-md avatar-rounded me-2">
                          <img src={row.img} alt="user" />
                        </span>
                        <h6 class="fw-medium mb-0">{row.name}</h6>
                      </div>
                    </td>
                    <td>{row.designation}</td>
                    <td>{row.department}</td>
                    <td>{row.appraisalDate}</td>
                    <td>
                      <span class={row.statusClass}>
                        <i class="ti ti-point-filled me-1"></i>{row.status}
                      </span>
                    </td>
                    <td class="text-end">
                      <div class="action-icon d-inline-flex">
                        <button
                          class="btn btn-link p-0 me-2"
                          data-id={row.id}
                          data-action="edit"
                          onclick={handleActionClick}
                        >
                          <i class="ti ti-edit"></i>
                        </button>
                        <button
                          class="btn btn-link p-0 text-danger"
                          data-id={row.id}
                          data-action="delete"
                          onclick={handleActionClick}
                        >
                          <i class="ti ti-trash"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <template lwc:if={isModalOpen}>
    <div
      class="modal custom-modal fade show d-block"
      role="dialog"
      style="background: rgba(0, 0, 0, 0.6); z-index: 1050"
    >
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title">{addBtnLabel}</h4>
            <button
              type="button"
              class="btn-close"
              data-action="closeModal"
              onclick={handleActionClick}
            ></button>
          </div>
          <div class="modal-body pb-0">
            <p class="text-center">
              Performance Appraisal Entry Form will go here.
            </p>
          </div>
          <div class="modal-footer">
            <button
              class="btn btn-light"
              data-action="closeModal"
              onclick={handleActionClick}
            >
              Cancel
            </button>
            <button
              class="btn btn-primary"
              data-action="closeModal"
              onclick={handleActionClick}
            >
              Save
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>
</template>
