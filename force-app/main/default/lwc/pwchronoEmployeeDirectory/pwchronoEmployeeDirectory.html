<template>
  <div class="page-wrapper">
    <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
      <!-- PwChrono Standard Header -->
      <div
        class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3"
      >
        <div class="my-auto mb-2">
          <h2 class="mb-1 text-2xl font-bold text-gray-900">
            Employee Directory
          </h2>
          <p class="text-muted text-sm text-gray-500">
            Find and connect with colleagues
          </p>
        </div>
        <div class="d-flex my-xl-auto right-content">
          <div class="w-full md:w-64">
            <lightning-input
              type="search"
              placeholder="Search employees..."
              onchange={handleSearch}
              variant="label-hidden"
            >
            </lightning-input>
          </div>
        </div>
      </div>

      <div class="p-0">
        <template if:true={isLoading}>
          <div class="flex justify-center items-center p-12">
            <div
              class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500"
            ></div>
          </div>
        </template>

        <template if:true={loadError}>
          <div class="bg-red-50 border border-red-200 rounded-lg p-4">
            <div class="flex gap-3">
              <lightning-icon
                icon-name="utility:error"
                alternative-text="Error"
                variant="error"
                class="flex-shrink-0"
              ></lightning-icon>
              <div>
                <p class="font-semibold text-red-900">
                  Error loading employees
                </p>
                <p class="text-sm text-red-700 mt-1">{loadError}</p>
              </div>
            </div>
          </div>
        </template>

        <template if:true={employees}>
          <template if:true={employees.length}>
            <!-- Results count and pagination controls -->
            <div
              class="flex flex-col sm:flex-row items-center justify-between mb-4 gap-3"
            >
              <span class="text-sm text-gray-600 font-medium"
                >{totalCount} employees found</span
              >
              <div class="flex items-center gap-3">
                <lightning-combobox
                  value={pageSize}
                  options={pageSizeOptions}
                  onchange={handlePageSizeChange}
                  variant="label-hidden"
                  class="w-36"
                ></lightning-combobox>
              </div>
            </div>

            <div
              class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
            >
              <template for:each={employees} for:item="emp">
                <div
                  key={emp.Id}
                  class="relative bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition-shadow overflow-hidden"
                >
                  <button
                    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer border-0 p-0 m-0 z-10"
                    onclick={handleNavigate}
                    data-id={emp.Id}
                    type="button"
                  >
                    <span class="sr-only">View Details</span>
                  </button>
                  <!-- Card Header with Avatar -->
                  <div
                    class="bg-gradient-to-r from-orange-50 to-orange-100 p-6 text-center border-b border-gray-200"
                  >
                    <div
                      class="w-16 h-16 rounded-full bg-gradient-to-br from-orange-400 to-orange-500 flex items-center justify-center text-white text-xl font-bold mx-auto mb-3"
                    >
                      {emp.initials}
                    </div>
                    <div
                      class="font-semibold text-gray-900 truncate"
                      title={emp.Name}
                    >
                      {emp.Name}
                    </div>
                    <div
                      class="text-sm text-gray-600 truncate"
                      title={emp.Designation__c}
                    >
                      {emp.Designation__c}
                    </div>
                  </div>

                  <!-- Card Content -->
                  <div class="p-4 space-y-3">
                    <div class="border-b border-gray-100 pb-3">
                      <div
                        class="text-xs font-medium text-gray-500 uppercase mb-1"
                      >
                        Department
                      </div>
                      <div
                        class="text-sm text-gray-900 truncate"
                        title={emp.Department__c}
                      >
                        {emp.Department__c}
                      </div>
                    </div>

                    <div class="border-b border-gray-100 pb-3">
                      <div
                        class="text-xs font-medium text-gray-500 uppercase mb-1"
                      >
                        Email
                      </div>
                      <div class="text-sm text-gray-900 truncate">
                        <lightning-formatted-email
                          value={emp.Email__c}
                        ></lightning-formatted-email>
                      </div>
                    </div>

                    <div class="border-b border-gray-100 pb-3">
                      <div
                        class="text-xs font-medium text-gray-500 uppercase mb-1"
                      >
                        Phone
                      </div>
                      <div class="text-sm text-gray-900 truncate">
                        <lightning-formatted-phone
                          value={emp.Phone__c}
                        ></lightning-formatted-phone>
                      </div>
                    </div>

                    <template if:true={emp.managerName}>
                      <div>
                        <div
                          class="text-xs font-medium text-gray-500 uppercase mb-1"
                        >
                          Manager
                        </div>
                        <div
                          class="text-sm text-gray-900 truncate"
                          title={emp.managerName}
                        >
                          {emp.managerName}
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>

            <!-- Pagination Controls -->
            <div
              class="flex flex-col sm:flex-row items-center justify-between mt-6 gap-3 bg-gray-50 rounded-xl px-4 py-4"
            >
              <span class="text-sm text-gray-600">{pageInfo}</span>
              <div class="flex gap-1">
                <button
                  class="px-3 py-1.5 rounded-lg border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                  onclick={handlePrevPage}
                  disabled={isPrevDisabled}
                >
                  ← Prev
                </button>
                <button
                  class="px-3 py-1.5 rounded-lg border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                  onclick={handleNextPage}
                  disabled={isNextDisabled}
                >
                  Next →
                </button>
              </div>
            </div>
          </template>

          <template if:false={employees.length}>
            <div class="text-center py-12">
              <lightning-icon
                icon-name="utility:search"
                size="large"
                class="text-gray-400 mb-4"
              ></lightning-icon>
              <p class="text-gray-500 font-medium">No employees found</p>
              <p class="text-sm text-gray-400 mt-1">
                Try adjusting your search criteria
              </p>
            </div>
          </template>
        </template>
      </div>
    </div>
  </div>
</template>
