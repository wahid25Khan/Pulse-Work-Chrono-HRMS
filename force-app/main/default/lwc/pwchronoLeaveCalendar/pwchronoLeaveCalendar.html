<template>
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
    <!-- Header -->
    <div class="bg-gradient-to-r from-cyan-500 to-cyan-600 px-6 py-5 text-white">
      <h1 class="text-xl font-bold">Leave Calendar</h1>
      <p class="text-sm text-white/80 mt-1">View scheduled leaves and holidays</p>
    </div>

    <div class="p-4 md:p-6">
      <!-- Loading State -->
      <template if:true={isLoading}>
        <div class="flex items-center justify-center py-12">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-cyan-600"></div>
          <span class="ml-3 text-gray-600">Loading calendar...</span>
        </div>
      </template>

      <template if:false={isLoading}>
      <!-- Header: Month Navigation -->
      <div class="flex items-center justify-between mb-6">
        <lightning-button-icon
          icon-name="utility:chevronleft"
          onclick={handlePrevMonth}
          alternative-text="Previous Month"
          variant="border-filled"
        ></lightning-button-icon>
        <h2 class="text-xl font-bold text-gray-800">
          {currentMonthName} {currentYear}
        </h2>
        <lightning-button-icon
          icon-name="utility:chevronright"
          onclick={handleNextMonth}
          alternative-text="Next Month"
          variant="border-filled"
        ></lightning-button-icon>
      </div>

      <!-- Calendar Grid -->
      <template if:true={hasLeaveOrHolidays}>
        <div class="calendar-grid">
          <!-- Weekday Headers -->
          <div class="calendar-header">Sun</div>
          <div class="calendar-header">Mon</div>
          <div class="calendar-header">Tue</div>
          <div class="calendar-header">Wed</div>
          <div class="calendar-header">Thu</div>
          <div class="calendar-header">Fri</div>
          <div class="calendar-header">Sat</div>

          <!-- Days -->
          <template for:each={calendarDays} for:item="day">
            <div key={day.id} class={day.cssClass}>
              <div class="day-number">{day.number}</div>
              <div class="day-events">
                <template for:each={day.events} for:item="event">
                  <div key={event.id} class={event.cssClass} title={event.title}>
                    {event.title}
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- Empty State -->
      <template if:false={hasLeaveOrHolidays}>
        <div class="flex flex-col items-center justify-center py-12 text-center">
          <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-4">
            <lightning-icon icon-name="utility:event" size="medium" class="text-gray-400"></lightning-icon>
          </div>
          <p class="text-gray-500">No leave scheduled for this period.</p>
        </div>
      </template>
      </template>
    </div>
  </div>
</template>
