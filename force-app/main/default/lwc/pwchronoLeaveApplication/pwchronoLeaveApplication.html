<template>
  <div class="page-wrapper">
    <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
      <!-- PwChrono Standard Header -->
      <div
        class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3"
      >
        <div class="my-auto mb-2">
          <h2 class="mb-1 text-2xl font-bold text-gray-900">Apply for Leave</h2>
          <p class="text-muted text-sm text-gray-500">
            Submit a new leave request
          </p>
        </div>
        <div class="d-flex my-xl-auto right-content"></div>
      </div>

      <div
        class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"
      >
        <div class="p-4 md:p-6">
          <template if:true={isLoading}>
            <div class="flex justify-center items-center p-8">
              <div
                class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500"
              ></div>
            </div>
          </template>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Leave Type Selection -->
            <div>
              <lightning-combobox
                name="leaveType"
                label="Leave Type"
                value={leaveRecord.Leave_Type__c}
                placeholder="Select Leave Type"
                options={leaveTypeOptions}
                onchange={handleLeaveTypeChange}
                required
              ></lightning-combobox>
            </div>

            <!-- Balance Display -->
            <div class="flex items-end">
              <template if:true={selectedLeaveBalance}>
                <div
                  class="w-full p-4 bg-green-50 rounded-xl border border-green-200"
                >
                  <p class="text-sm text-green-800">
                    <span class="font-semibold">Available Balance:</span>
                    {selectedLeaveBalance} days
                  </p>
                </div>
              </template>
            </div>

            <!-- Date Range -->
            <div>
              <lightning-input
                type="date"
                name="fromDate"
                label="From Date"
                value={leaveRecord.From_Date__c}
                onchange={handleDateChange}
                required
              ></lightning-input>
            </div>

            <div>
              <lightning-input
                type="date"
                name="toDate"
                label="To Date"
                value={leaveRecord.To_Date__c}
                onchange={handleDateChange}
                required
              ></lightning-input>
            </div>

            <!-- Half Day Option -->
            <div class="md:col-span-2">
              <lightning-input
                type="checkbox"
                label="Half Day"
                checked={leaveRecord.Half_Day__c}
                onchange={handleHalfDayChange}
              ></lightning-input>
            </div>

            <!-- Total Days Info -->
            <div class="md:col-span-2">
              <p class="text-sm text-gray-500 italic">
                Total days will be calculated upon submission based on working
                days and holidays.
              </p>
            </div>

            <!-- Reason -->
            <div class="md:col-span-2">
              <lightning-textarea
                name="reason"
                label="Reason"
                value={leaveRecord.Reason__c}
                onchange={handleReasonChange}
                required
              ></lightning-textarea>
            </div>
          </div>

          <!-- Actions -->
          <div class="flex justify-end gap-3 mt-6">
            <lightning-button
              label="Cancel"
              onclick={handleCancel}
            ></lightning-button>
            <lightning-button
              variant="brand"
              label="Submit Application"
              onclick={handleSubmit}
              disabled={isSubmitDisabled}
            ></lightning-button>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
