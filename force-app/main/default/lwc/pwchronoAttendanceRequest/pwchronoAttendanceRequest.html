<template>
  <div class="space-y-6">
    <!-- Regularization Request Form -->
    <div
      class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"
    >
      <div
        class="bg-gradient-to-r from-teal-500 to-teal-600 px-6 py-5 text-white"
      >
        <h1 class="text-xl font-bold">Attendance Regularization</h1>
        <p class="text-sm text-white/80 mt-1">
          Submit a request to regularize your attendance
        </p>
      </div>

      <div class="p-4 md:p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <lightning-input
              type="date"
              label="Attendance Date"
              value={attendanceDate}
              onchange={handleDateChange}
              required
              disabled={isDateDisabled}
            ></lightning-input>
          </div>
          <div class="hidden md:block">
            <!-- Spacer or Shift Info -->
          </div>

          <div>
            <lightning-input
              type="time"
              label="Check-In Time"
              value={checkInTime}
              onchange={handleCheckInChange}
              disabled={isCheckInDisabled}
            ></lightning-input>
          </div>
          <div>
            <lightning-input
              type="time"
              label="Check-Out Time"
              value={checkOutTime}
              onchange={handleCheckOutChange}
              disabled={isCheckOutDisabled}
            ></lightning-input>
          </div>

          <div class="md:col-span-2">
            <lightning-textarea
              label="Reason"
              value={reason}
              onchange={handleReasonChange}
              required
              placeholder="Please explain the reason for regularization..."
              disabled={isReasonDisabled}
            ></lightning-textarea>
          </div>
        </div>

        <div class="flex justify-end mt-6">
          <lightning-button
            variant="brand"
            label="Submit Request"
            onclick={handleSubmit}
            disabled={isSubmitDisabled}
          ></lightning-button>
        </div>
      </div>
    </div>

    <!-- Request History -->
    <div
      class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"
    >
      <div
        class="px-6 py-4 border-b border-gray-200 flex justify-between items-center"
      >
        <h2 class="text-lg font-semibold text-gray-800">My Requests</h2>
        <span class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full"
          >{allRequests.length} total</span
        >
      </div>

      <div class="p-4 md:p-6">
        <!-- Loading State -->
        <template if:true={isLoading}>
          <div class="flex items-center justify-center py-12">
            <div
              class="animate-spin rounded-full h-8 w-8 border-b-2 border-teal-600"
            ></div>
            <span class="ml-3 text-gray-600">Loading requests...</span>
          </div>
        </template>

        <template if:false={isLoading}>
          <template if:true={hasRequests}>
            <div class="overflow-x-auto rounded-xl border border-gray-200">
              <lightning-datatable
                key-field="Id"
                data={requests}
                columns={columns}
                hide-checkbox-column
              ></lightning-datatable>
            </div>
            <!-- Pagination Controls -->
            <div
              class="flex flex-col sm:flex-row items-center justify-between px-4 py-4 bg-gray-50 border-t border-gray-200 gap-3 mt-4 rounded-xl"
            >
              <div class="flex items-center gap-2">
                <lightning-combobox
                  value={pageSize}
                  options={pageSizeOptions}
                  onchange={handlePageSizeChange}
                  variant="label-hidden"
                  class="w-36"
                ></lightning-combobox>
              </div>
              <div class="flex items-center gap-3">
                <span class="text-sm text-gray-600">{pageInfo}</span>
                <div class="flex gap-1">
                  <button
                    class="px-3 py-1.5 rounded-lg border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                    onclick={handlePrevPage}
                    disabled={isPrevDisabled}
                  >
                    ← Prev
                  </button>
                  <button
                    class="px-3 py-1.5 rounded-lg border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                    onclick={handleNextPage}
                    disabled={isNextDisabled}
                  >
                    Next →
                  </button>
                </div>
              </div>
            </div>
          </template>
          <template if:false={hasRequests}>
            <div
              class="flex flex-col items-center justify-center py-12 text-center"
            >
              <div
                class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-4"
              >
                <lightning-icon
                  icon-name="utility:clock"
                  size="medium"
                  class="text-gray-400"
                ></lightning-icon>
              </div>
              <p class="text-gray-500">No attendance requests found.</p>
            </div>
          </template>
        </template>

        <template if:true={error}>
          <div
            class="p-4 bg-red-50 border border-red-200 rounded-xl text-red-600"
          >
            {error}
          </div>
        </template>
      </div>
    </div>
  </div>
</template>
